<!DOCTYPE html>
<html lang="su"><head><meta charset="utf-8"><title>Lab Maya – Ciri jeung Struktur Tradisi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#1b1020;--card:#fff8ec;--ink:#2b1b12;--pri:#b5451b;--sec:#2f7d5b;--acc:#f2b632;--mut:#7a6556;--ok:#2f7d5b;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--card:#2a1e18;--ink:#f6ead9;--mut:#c9b49e;--pri:#e8714a;--sec:#4fb58a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);display:grid;place-items:center;overflow:hidden;font-family:Georgia,'Segoe UI',serif}
#st{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:size;background:var(--card);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-size:1.45cqw}
header{display:flex;align-items:center;gap:1.2cqw;padding:.9cqw 1.6cqw;background:linear-gradient(90deg,#7a2e12,#b5451b);color:#fff}
header h1{font-size:2cqw;margin:0;flex:1}header small{display:block;font-size:1.05cqw;font-weight:400;opacity:.85}
button{font:inherit;cursor:pointer;border:0;border-radius:.7cqw;padding:.5cqw 1.1cqw;background:var(--acc);color:#2b1b12;font-weight:700}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)}
nav{display:flex;gap:.5cqw;padding:.6cqw 1.6cqw 0;background:#e9d3b4}
nav button{background:#f6e6cc;border-radius:.8cqw .8cqw 0 0;color:#5a3a22}nav button.on{background:var(--card);color:var(--pri)}
@media (prefers-color-scheme:dark){nav{background:#3b2a20}nav button{background:#4a3629;color:#f6ead9}nav button.on{background:var(--card)}}
main{flex:1;min-height:0;padding:1.2cqw 1.8cqw;display:flex;gap:1.4cqw}
footer{display:flex;justify-content:space-between;align-items:center;padding:.5cqw 1.8cqw;font-size:1cqw;color:var(--mut);border-top:1px solid #d8bf98}
.side{width:19cqw;display:flex;flex-direction:column;gap:.6cqw}.side button{text-align:left;background:#f1dcbc;color:#4a2b16}
.side button.on{background:var(--pri);color:#fff}.side button.v::after{content:" ✓"}
.pane{flex:1;min-width:0;background:rgba(181,69,27,.07);border-radius:1cqw;padding:1.2cqw 1.6cqw;overflow:hidden}
h2{margin:0 0 .6cqw;font-size:1.9cqw;color:var(--pri)}p{margin:.4cqw 0;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:.5cqw;margin:.5cqw 0}.chip{background:var(--sec);color:#fff;padding:.3cqw .8cqw;border-radius:2cqw;font-size:1.2cqw;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw}.box{background:var(--card);border-left:.4cqw solid var(--acc);padding:.6cqw .9cqw;border-radius:.6cqw}
.step{display:flex;gap:1cqw;align-items:center;background:var(--card);padding:.8cqw 1.1cqw;border-radius:.8cqw;margin:.6cqw 0;cursor:pointer;border:.15cqw solid #d8bf98}
.step.d{border-color:var(--ok);background:rgba(47,125,91,.15)}.num{width:2.6cqw;height:2.6cqw;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
.bar{height:1cqw;background:#e0c9a6;border-radius:1cqw;overflow:hidden}.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.opt{display:block;width:100%;text-align:left;margin:.5cqw 0;background:var(--card);color:var(--ink);border:.15cqw solid #d8bf98}.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.tr{display:flex;gap:.5cqw;flex-wrap:wrap;min-height:3.4cqw;background:var(--card);border:.15cqw dashed var(--pri);border-radius:.8cqw;padding:.5cqw;margin:.5cqw 0}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-.6cqw)}75%{transform:translateX(.6cqw)}}
.slot{display:flex;align-items:center;gap:.8cqw;margin:.4cqw 0;background:var(--card);padding:.4cqw .8cqw;border-radius:.6cqw}.slot .z{min-width:14cqw;min-height:2.6cqw;border:.15cqw dashed var(--pri);border-radius:.5cqw;display:grid;place-items:center;font-weight:700}
.z.ok{background:var(--ok);color:#fff}.z.bad{background:var(--bad);color:#fff}.pool .chip{background:var(--pri);cursor:grab}.pool .chip.sel{outline:.3cqw solid var(--acc)}
.big{font-size:5cqw;color:var(--pri);font-weight:700;text-align:center;margin:1cqw 0}

#st{position:relative}
#sp{position:absolute;inset:0;z-index:50;background:#120a18;display:flex;justify-content:center;transition:opacity .6s}
#sp.out{opacity:0;pointer-events:none}

<header><div style="font-size:2.6cqw">🏺</div><h1>Lab Maya Basa Sunda<small>Ngidéntifikasi Ciri-Ciri jeung Struktur Tradisi · Kelas XII · Fase F</small></h1><button id="snd" onclick="tg()">🔊 Sora</button><button id="mus" onclick="tm()">🎶 Musik</button></header>

<div id="sp"><div id="spw"><div id="spn">Okeu Kusumawati, S.Pd.<br>SMAN 1 Sukaraja Kab. Sukabumi</div><button id="spb" disabled aria-label="Mulai"></button><div id="spl"><span id="spt">Memuat…</span> <b id="spp">0%</b><div class="b"><i id="spi"></i></div></div></div></div></div>
<script>
const $=s=>document.querySelector(s);let on=true,ac,tab=0;
function bp(f,d,t){if(!on)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.12;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
/* AUDIO: sintesis degung Sunda (original, bebas hak cipta) */
const SC=[0,2,3,7,8],nf=d=>220*Math.pow(2,(SC[((d%5)+5)%5]+12*Math.floor(d/5))/12);let mu=true,mg,mi,stp=0,nxt=0;
function C(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();return ac}
function mt(f,d,v,at,dst){try{const c=C(),n=at||c.currentTime;[[1,1],[2.76,.35],[5.4,.12]].forEach(([r,a])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f*r;g.gain.setValueAtTime(v*a,n);g.gain.exponentialRampToValueAtTime(.0001,n+d/(r>1?r*.6:1));o.connect(g);g.connect(dst||c.destination);o.start(n);o.stop(n+d)})}catch(e){}}
function gong(at,dst,v){try{const c=C(),n=at||c.currentTime;[[1,1],[2.01,.4],[3.2,.2]].forEach(([r,a])=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=82*r;g.gain.setValueAtTime((v||.25)*a,n);g.gain.exponentialRampToValueAtTime(.0001,n+3);o.connect(g);g.connect(dst||c.destination);o.start(n);o.stop(n+3)})}catch(e){}}
function kd(at,dst,dung){try{const c=C(),g=c.createGain();g.connect(dst);if(dung){const o=c.createOscillator();o.frequency.setValueAtTime(130,at);o.frequency.exponentialRampToValueAtTime(65,at+.2);g.gain.setValueAtTime(.35,at);g.gain.exponentialRampToValueAtTime(.0001,at+.25);o.connect(g);o.start(at);o.stop(at+.3)}else{const b=c.createBuffer(1,c.sampleRate*.08,c.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=c.createBufferSource(),f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;s.buffer=b;s.connect(f);f.connect(g);g.gain.setValueAtTime(.18,at);s.start(at)}}catch(e){}}
const PH=[[4,5,6,5,4,3,4,2],[4,5,6,5,4,3,4,2],[2,3,4,3,2,1,2,0],[4,5,6,5,4,3,4,2]];
function sch(){const c=C();while(nxt<c.currentTime+.3){const t=nxt,k=stp%8,p=PH[Math.floor(stp/8)%4];
if(k!=7||stp%16==7)mt(nf(p[k]+5),1.3,.16,t,mg);
if(k%2==0)mt(nf([0,2,0,3][k/2])/2,1.6,.2,t,mg);
if(stp%32==0)gong(t,mg,.3);if(k%4==0)kd(t,mg,1);else if(k%4==2||k==7)kd(t,mg,0);
nxt+=.42;stp++}}
function music(o){const c=C();if(!mg){mg=c.createGain();mg.gain.value=0;mg.connect(c.destination)}
mg.gain.cancelScheduledValues(c.currentTime);mg.gain.setTargetAtTime(o?.5:0,c.currentTime,.2);
if(o&&!mi){nxt=c.currentTime+.1;mi=setInterval(sch,100)}if(!o&&mi){clearInterval(mi);mi=0}}
function tm(){mu=!mu;$('#mus').textContent=mu?'🎶 Musik':'🔇 Musik';if(!$('#sp'))music(mu);clk()}
const clk=()=>{if(on)mt(nf(5),.5,.1)},good=()=>{if(on){const c=C().currentTime;mt(nf(5),.8,.12,c);mt(nf(8),1,.12,c+.12)}},bad=()=>{if(on)gong(0,0,.3)};
function tg(){on=!on;$('#snd').textContent=on?'🔊 Sora':'🔇 Jempé';clk()}
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TABS=['🧪 Prosedur','📖 Teori','🎮 Simulasi','📝 LKPD','👤 Pengembang','📊 Nilai'];
$('#nav').innerHTML=TABS.map((t,i)=>`<button onclick="go(${i})">${t}</button>`).join('');
function go(i){tab=i;clk();[...$('#nav').children].forEach((b,k)=>b.classList.toggle('on',k==i));[T,P,S,L,D][i]=== T?rT():[0,rP,rS,rL,rD][i]()}
/* TEORI */
const TO=[
['Ciri Tradisi',`<p><b>Tradisi</b> (basa Inggris: <i>tradition</i>) hartina adat kabiasaan atawa tali paranti anu turun-tumurun ti karuhun, masih dilaksanakeun dina pakumbuhan masarakat, jeung dimumulé ku cara diwariskeun ti kolot ka anakna, lisan atawa tinulis.</p><p>Tradisi kaasup <b>folklor</b>: <i>folk</i> = kumpulan/gundukan, <i>lore</i> = tradisi. Folklor diwariskeun sacara lisan (tradisi lisan).</p><div class="grid"><div class="box"><b>Adat</b> (Arab: <i>adath</i>) = tabéat atawa sipat bawaan. Paribasa: “Adat kakurung ku iga”.</div><div class="box"><b>Adat istiadat</b> = kabiasaan nu geus diiluan ku masarakat dina waktu lila, jadi padoman, ngandung aturan ideal pikeun hubungan antaranggota masarakat.</div></div>`],
['Unsur Tradisi',`<p>Unsur-unsur anu aya dina tradisi atawa adat istiadat:</p><div class="chips"><span class="chip">1 Ayana paripolah hiji jalma/masarakat</span><span class="chip">2 Dipilampah tuluy-tuluyan</span><span class="chip">3 Ayana diménsi waktu</span><span class="chip">4 Sakurang-kurangna tilu entragan</span><span class="chip">5 Dituturkeun ku jalma lianna</span></div><p><b>Tilu rupa ajén budaya:</b></p><div class="grid"><div class="box">1) Sistim norma – peranan jalma</div><div class="box">2) Sistim hukum – aturan pikeun suasana tartib</div><div class="box">3) Aturan husus – aturan masarakat nu tangtu</div></div>`],
['Wanda Tradisi',`<div class="grid"><div class="box"><b>Upacara daur hirup</b><br>nyiram, ngariksa nu reuneuh (tingkeban/tujuh bulanan), ngariksa nu ngajuru, mulasara bali, ngurus orok, sunatan, ngawinkeun, kapapaténan.</div><div class="box"><b>Nuansa kaagamaan</b><br>rebo wekasan, bubur asyura, nyalawéan, hajat sasih, ngirab, tahlilan.</div></div><div class="box" style="margin-top:.8cqw"><b>Pésta rayat</b><br>ampih paré, sérén taun, ngalaksa, ngarot, sidekah bumi, pésta laut, nyangku, ngalungsur pusaka, ngunjung, ruwatan bumi, kawin tiwu, pésta dadung.</div><p>Tradisi di sabudeureun urang bisa dipanggihan di buku, majalah, koran, atawa internét.</p>`],
['Struktur Upacara',`<p>Struktur upacara tradisi ngawengku <b>4 unsur</b>:</p><div class="grid"><div class="box"><b>1) Latar</b> – tempat jeung waktu (di jero/luar rohangan; isuk-isuk, pabeubeurang, pasosoré, bada isa, sapeuting jeput).</div><div class="box"><b>2) Palaku</b> – budak, rumaja, kolot, awéwé, lalaki, atawa campur; ciri has béda-béda.</div><div class="box"><b>3) Properti</b> – alat-alat/pakakas, papakéan, jeung kadaharan.</div><div class="box"><b>4) Tahapan</b> – runtuyan kagiatan. Upacara ngalaksa di Rancakalong Sumedang: béwara, mera, meuseul, ngawasuhan, ngineb, numbuk, ngalaksa.</div></div>`],
['Fungsi & Ma’na',`<div class="grid"><div class="box"><b>Kaagamaan</b> – ngahormat Pangéran jeung karuhun.</div><div class="box"><b>Sosial</b> – kasalametan diri, kulawarga, masarakat.</div><div class="box"><b>Konsérvatif budaya</b> – ngamumulé budaya ti entragan ka entragan.</div><div class="box"><b>Integratif</b> – ngagumulungkeun sawangan hirup jeung étos.</div><div class="box"><b>Édukatif</b> – ngawariskeun tradisi sangkan dipikawanoh, dipiara, dimekarkeun.</div></div><p><b>Ma’na simbolik</b> dikandung dina unsur-unsur upacara; upamana wangun nyungcung (siga tumpeng) dianggap ngandung barokah.</p>`]];
let tv={},ti=0;
function rT(){const c=$('#c');c.innerHTML=`<div class="side">${TO.map((t,i)=>`<button class="${i==ti?'on ':''}${tv[i]?'v':''}" onclick="ti=${i};tv[ti]=1;clk();rT()">${t[0]}</button>`).join('')}<div class="bar"><i style="width:${Object.keys(tv).length/5*100}%"></i></div><small>${Object.keys(tv).length}/5 bagian dibaca</small></div><div class="pane"><h2>${TO[ti][0]}</h2>${TO[ti][1]}</div>`;tv[ti]=1}
/* PROSEDUR */
const PR=['Baca tab <b>Teori</b> nepi ka lima bagian ditandaan ✓.','Cirian <b>ciri tradisi</b>: adat, folklor, jeung lima unsurna.','Jalankeun <b>Simulasi A</b>: susun tahapan upacara Ngalaksa.','Jalankeun <b>Simulasi B</b>: idéntifikasi unsur struktur upacara.','Kerjakeun <b>LKPD</b> (15 PG + 5 drag drop) tuluy catet skorna.'];
let pd={};
function rP(){$('#c').innerHTML=`<div class="pane"><h2>Prosedur Kagiatan Lab</h2><p>Klik unggal léngkah upami geus réngsé.</p>${PR.map((s,i)=>`<div class="step ${pd[i]?'d':''}" onclick="pd[${i}]=!pd[${i}];pd[${i}]?good():clk();rP()"><span class="num">${pd[i]?'✓':i+1}</span><span>${s}</span></div>`).join('')}<div class="bar"><i style="width:${Object.values(pd).filter(Boolean).length*20}%"></i></div></div>`}
/* SIMULASI */
const TH=['Béwara (musawarah)','Mera (ngabagi-bagi bahan)','Meuseul (nutu paré)','Ngawasuhan (ngisikan béas)','Ngineb (neundeun béas)','Numbuk (nipung béas)','Ngalaksa (ngadonan tipung)'];
const SB=[['Upacara dilaksanakeun di imah, isuk-isuk.',0],['Budak, rumaja, kolot, awéwé jeung lalaki milu.',1],['Pakéan jeung kadaharan anu dipaké.',2],['Béwara, mera, meuseul, numbuk, ngalaksa.',3],['Dilaksanakeun bada isa nepi ka sapeuting jeput.',0],['Alat-alat atawa pakakas upacara.',2]];
const UN=['Latar','Palaku','Properti','Tahapan'];
let sm=0,sa={o:null,n:0},sb={i:0,s:0,done:0};
function rS(){if(!sa.o)sa.o=sh(TH.map((t,i)=>i));let h=`<div class="pane"><div class="chips"><button onclick="sm=0;clk();rS()">A · Susun Tahapan</button><button onclick="sm=1;clk();rS()">B · Idéntifikasi Struktur</button></div>`;
if(sm==0){h+=`<h2>Upacara Ngalaksa, Rancakalong Sumedang</h2><p>Klik tahapan nurutkeun runtuyan nu bener (1 → 7).</p><div class="tr">${TH.slice(0,sa.n).map((t,i)=>`<span class="chip">${i+1}. ${t}</span>`).join('')}</div><div class="chips">${sa.o.filter(i=>i>=sa.n).map(i=>`<button onclick="pa(${i},this)">${TH[i]}</button>`).join('')}</div>${sa.n==7?'<p class="big" style="font-size:2.2cqw">🎉 Mantap! Runtuyan tahapan geus bener.</p>':''}`}
else if(sb.i<6){h+=`<h2>Pernyataan ${sb.i+1}/6 · Skor ${sb.s}</h2><p style="font-size:1.8cqw" class="box">“${SB[sb.i][0]}”</p><p>Ieu kaasup unsur struktur naon?</p><div class="chips">${UN.map((u,k)=>`<button onclick="pb(${k},this)">${u}</button>`).join('')}</div>`}
else h+=`<h2>Hasil Simulasi B</h2><div class="big">${sb.s}/6</div><p style="text-align:center">${sb.s>=5?'Alus pisan!':'Cobaan deui sanggeus maca Teori.'}</p>`;
$('#c').innerHTML=h+'</div>'}
function pa(i,b){if(i==sa.n){sa.n++;good();rS()}else{bad();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),300)}}
function pb(k,b){if(k==SB[sb.i][1]){sb.s++;good()}else bad();sb.i++;setTimeout(rS,250)}
/* LKPD */
const Q=[
['Tradisi hartina…',['adat kabiasaan atawa tali paranti anu turun-tumurun','paribasa nu hésé','kasenian modéren','aturan nagara'],0],
['Kecap <i>lore</i> dina folklor hartina…',['kumpulan','gundukan','tradisi','lisan'],2],
['Paribasa “Adat kakurung ku iga” hartina…',['tabéat nu hésé dipiceunna atawa dirobahna','kabiasaan nu alus','adat nu geus leungit','aturan nagara'],0],
['Adat (basa Arab: <i>adath</i>) hartina…',['aturan hukum','tabéat atawa sipat bawaan','upacara agama','kasenian'],1],
['Tradisi sahenteuna diwariskeun ku…',['hiji entragan','dua entragan','tilu entragan','sapuluh entragan'],2],
['Nu lain unsur tradisi nyaéta…',['dipilampah tuluy-tuluyan','ayana diménsi waktu','dituturkeun ku jalma lianna','ngan dilaksanakeun sakali'],3],
['Nu kaasup tilu rupa ajén budaya nyaéta…',['sistim norma','sistim ékonomi','sistim pangan','sistim wangunan'],0],
['Upacara tujuh bulanan disebut…',['sunatan','tingkeban','ngarot','nyangku'],1],
['Nu kaasup upacara daur hirup nyaéta…',['sérén taun','tahlilan','sunatan','pésta laut'],2],
['Nu kaasup tradisi nuansa kaagamaan nyaéta…',['rebo wekasan','ampih paré','pésta dadung','kawin tiwu'],0],
['Nu kaasup pésta rayat nyaéta…',['bubur asyura','nyalawéan','tahlilan','sidekah bumi'],3],
['Struktur upacara tradisi ngawengku sabaraha unsur?',['dua','tilu','opat','lima'],2],
['Latar upacara nyoko kana…',['alat-alat','tempat jeung waktu','pakéan','palaku'],1],
['Properti upacara adat nyaéta…',['alat-alat, pakéan, jeung kadaharan','runtuyan kagiatan','budak jeung kolot','tempat upacara'],0],
['Fungsi upacara pikeun ngahormat Pangéran jeung karuhun nyaéta fungsi…',['sosial','édukatif','integratif','kaagamaan'],3]];
const DD=[['Kaagamaan','ngahormat Pangéran jeung karuhun'],['Sosial','kasalametan diri, kulawarga, jeung masarakat'],['Konsérvatif','ngamumulé budaya ti entragan ka entragan'],['Integratif','ngagumulungkeun sawangan hirup jeung étos'],['Édukatif','ngawariskeun tradisi sangkan dipikawanoh jeung dipiara']];
let l={i:0,a:{},dd:{},chk:false,sel:null,ord:null,sc:0};
function rL(){const c=$('#c');if(l.i<15){const q=Q[l.i],a=l.a[l.i];c.innerHTML=`<div class="pane"><h2>Soal ${l.i+1}/15 <small style="color:var(--mut)">· Skor ${l.sc}</small></h2><div class="bar"><i style="width:${l.i/20*100}%"></i></div><p style="font-size:1.8cqw;margin:1cqw 0">${q[0]}</p>${q[1].map((o,k)=>`<button class="opt ${a===undefined?'':k==q[2]?'ok':k==a?'bad':''}" ${a!==undefined?'disabled':''} onclick="ans(${k})">${'ABCD'[k]}. ${o}</button>`).join('')}${a!==undefined?`<button onclick="l.i++;clk();rL()">Lanjut ➜</button>`:''}</div>`}
else if(l.i==15){l.ord=l.ord||sh([0,1,2,3,4]);const used=Object.values(l.dd);c.innerHTML=`<div class="pane"><h2>Drag & Drop · Cocokkeun fungsi tradisi</h2><p>Sered istilah ka ma’na nu bener (bisa ogé klik istilah, tuluy klik kotakna).</p><div class="chips pool">${l.ord.filter(k=>!used.includes(k)).map(k=>`<span class="chip ${l.sel===k?'sel':''}" draggable="true" ondragstart="l.sel=${k}" onclick="l.sel=${k};clk();rL()">${DD[k][0]}</span>`).join('')}</div>${DD.map((d,i)=>`<div class="slot"><div class="z ${l.chk?(l.dd[i]==i?'ok':'bad'):''}" ondragover="event.preventDefault()" ondrop="pl(${i})" onclick="pl(${i})">${l.dd[i]!==undefined?DD[l.dd[i]][0]:'…'}</div><span>${d[1]}</span></div>`).join('')}<button onclick="ck()" ${l.chk?'disabled':''}>✔ Cék Jawaban</button> ${l.chk?'<button onclick="l.i++;clk();rL()">Tingali Hasil ➜</button>':''}</div>`}
else{const s=Math.round(l.sc/20*100);c.innerHTML=`<div class="pane"><h2>Hasil LKPD</h2><div class="big">${s}</div><p style="text-align:center">${l.sc} bener ti 20 soal · ${s>=80?'Alus pisan! 🌟':s>=60?'Cukup, tuluy diajar.':'Baca deui Teori, tuluy cobaan deui.'}</p></div>`}}
function ans(k){l.a[l.i]=k;if(k==Q[l.i][2]){l.sc++;good()}else bad();rL()}
function pl(i){if(l.chk||l.sel===null)return;for(const s in l.dd)if(l.dd[s]===l.sel)delete l.dd[s];l.dd[i]=l.sel;l.sel=null;clk();rL()}

function rN(){const c=cur();$('#c').innerHTML=`<div class="pane nl" style="display:flex;flex-direction:column;gap:.6cqw"><h2 style="margin:0">Rekap Nilai Akhir Siswa</h2><div class="chips" style="align-items:center;margin:0"><input id="nm" placeholder="Nama siswa"><input id="kl" placeholder="Kelas (XII-1)" style="width:9cqw"><button onclick="svn()">💾 Simpan Nilai Kuring</button><span class="chip">Sim A ${c.a}</span><span class="chip">Sim B ${c.b}</span><span class="chip">PG ${c.pg}/15</span><span class="chip">DD ${c.dd}/5</span></div><small style="color:var(--mut)">Nilai Akhir = 70% LKPD + 15% Simulasi A + 15% Simulasi B · KKM 75 · ${rows.length} siswa</small><div class="tbl"><table><tr><th>No</th><th>Nama Siswa</th><th>Kelas</th><th>Sim A</th><th>Sim B</th><th>PG</th><th>DD</th><th>LKPD</th><th>Nilai Akhir</th><th>Ket.</th><th></th></tr>${rows.length?rows.map((r,i)=>{const x=calc(r);return`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${esc(r.k)}</td><td>${r.a}</td><td>${r.b}</td><td>${r.pg}</td><td>${r.dd}</td><td>${x.h}</td><td><b>${x.f}</b></td><td class="${x.k=='Tuntas'?'t':'r'}">${x.k}</td><td><button onclick="del(${i})">✕</button></td></tr>`}).join(''):'<tr><td colspan="11" style="padding:2cqw;color:var(--mut)">Acan aya data. Réngsékeun LKPD, tuluy isi nami jeung klik Simpan.</td></tr>'}</table></div><div class="chips" style="margin:0"><button onclick="xl()">⬇ Unduh Excel (.xlsx)</button><button onclick="csv()">⬇ Unduh CSV</button><button onclick="clr(this)" style="background:#e8a39b">🗑 Hapus semua</button></div></div>`}
function svn(){const n=$('#nm').value.trim();if(!n){bad();$('#nm').focus();return}rows.push({n,k:$('#kl').value.trim(),...cur()});sv();good();rN()}
function del(i){rows.splice(i,1);sv();clk();rN()}

const tbl=()=>[['No','Nama Siswa','Kelas','Simulasi A (0-100)','Simulasi B (0-100)','LKPD PG (0-15)','LKPD Drag Drop (0-5)','Nilai LKPD (0-100)','Nilai Akhir','Keterangan'],...rows.map((r,i)=>{const x=calc(r);return[i+1,r.n,r.k,r.a,r.b,r.pg,r.dd,x.h,x.f,x.k]})];
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();good();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500)}
function csv(){dl(new Blob(['\ufeff'+tbl().map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'Nilai_Akhir_Tradisi_XII.csv')}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=-1;for(const x of b)c=crcT[(c^x)&255]^(c>>>8);return(c^-1)>>>0};
function zip(fs){const e=new TextEncoder(),P=[],C=[];let o=0;for(const[n,d]of fs){const nb=e.encode(n),db=e.encode(d),c=crc(db);
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,33,true);h.setUint32(14,c,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);P.push(new Uint8Array(h.buffer),nb,db);
const g=new DataView(new ArrayBuffer(46));g.setUint32(0,0x02014b50,true);g.setUint16(4,20,true);g.setUint16(6,20,true);g.setUint16(8,0x800,true);g.setUint16(14,33,true);g.setUint32(16,c,true);g.setUint32(20,db.length,true);g.setUint32(24,db.length,true);g.setUint16(28,nb.length,true);g.setUint32(42,o,true);C.push(new Uint8Array(g.buffer),nb);o+=30+nb.length+db.length}
const cs=C.reduce((s,x)=>s+x.length,0),z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,fs.length,true);z.setUint16(10,fs.length,true);z.setUint32(12,cs,true);z.setUint32(16,o,true);
return new Blob([...P,...C,new Uint8Array(z.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xl(){const T=tbl(),u=p=>'ht'+'tp://schemas.openxmlformats.org/'+p,X='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>',col=n=>String.fromCharCode(65+n);let sd='';
T.forEach((r,i)=>{const n=i+1;sd+=`<row r="${n}">`+r.map((v,j)=>{const a=col(j)+n;
if(i&&j==7)return`<c r="${a}"><f>ROUND((F${n}+G${n})/20*100,0)</f><v>${v}</v></c>`;
if(i&&j==8)return`<c r="${a}"><f>ROUND(0.7*H${n}+0.15*D${n}+0.15*E${n},0)</f><v>${v}</v></c>`;
if(i&&j==9)return`<c r="${a}" t="str"><f>IF(I${n}&gt;=75,"Tuntas","Remedial")</f><v>${v}</v></c>`;
return typeof v=='number'?`<c r="${a}"><v>${v}</v></c>`:`<c r="${a}" t="inlineStr"><is><t>${esc(v)}</t></is></c>`}).join('')+'</row>'});
const W=[5,28,10,14,14,13,16,16,12,12].map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('');
dl(zip([['[Content_Types].xml',X+`<Types xmlns="${u('../../x').slice(0,0)}ht`+`tp://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`],
['_rels/.rels',X+`<Relationships xmlns="${u('package/2006/relationships')}"><Relationship Id="rId1" Type="${u('officeDocument/2006/relationships/officeDocument')}" Target="xl/workbook.xml"/></Relationships>`],
['xl/workbook.xml',X+`<workbook xmlns="${u('spreadsheetml/2006/main')}" xmlns:r="${u('officeDocument/2006/relationships')}"><sheets><sheet name="Nilai Akhir" sheetId="1" r:id="rId1"/></sheets></workbook>`],
['xl/_rels/workbook.xml.rels',X+`<Relationships xmlns="${u('package/2006/relationships')}"><Relationship Id="rId1" Type="${u('officeDocument/2006/relationships/worksheet')}" Target="worksheets/sheet1.xml"/></Relationships>`],
['xl/worksheets/sheet1.xml',X+`<worksheet xmlns="${u('spreadsheetml/2006/main')}"><cols>${W}</cols><sheetData>${sd}</sheetData></worksheet>`]]),'Nilai_Akhir_Tradisi_XII.xlsx')}
function reset(){clk();if(tab==1){tv={};ti=0}if(tab==0)pd={};if(tab==2){sa={o:null,n:0};sb={i:0,s:0,done:0}}if(tab==3)l={i:0,a:{},dd:{},chk:false,sel:null,ord:null,sc:0};go(tab)}
